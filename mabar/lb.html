<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Samurai Blade Monthly Leaderboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:ital,wght@1,400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>

:root{
  --samurai-orange:#FF8900;
  --samurai-glow:rgba(255,137,0,0.5);
  --bg-black:rgba(10,10,10,0.9);
  --text-white:#ffffff;
}

body{
  margin:0;
  background:transparent;
  font-family:'Cinzel',serif;
  overflow:hidden;
}

/* wrapper */

.wrapper{
  position:fixed;
  top:30px;
  right:30px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

/* blade container */

.blade-box{
  position:relative;
  background:var(--bg-black);
  padding:16px 35px;
  min-width:300px;

  transform:skewX(-20deg);

  border-right:8px solid var(--samurai-orange);
  border-left:2px solid rgba(255,137,0,0.3);

  box-shadow:-10px 0 20px rgba(0,0,0,0.5);
  overflow:hidden;
}

/* blade shine */

.blade-box::after{
  content:'';
  position:absolute;
  top:0;
  left:-150%;
  width:100%;
  height:100%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.3),
    transparent
  );

  animation:slash 5s infinite;
}

@keyframes slash{
  0%,40%{left:-150%}
  50%,100%{left:150%}
}

/* inner area */

.inner-content{
  transform:skewX(20deg);
  text-align:right;
}

/* title */

.board-title{
  font-size:0.75rem;
  letter-spacing:4px;
  color:var(--samurai-orange);
  margin-bottom:10px;
}

/* leaderboard rows */

.rank-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 0;
  font-size:0.9rem;
  color:var(--text-white);
}

.rank-pos{
  color:var(--samurai-orange);
  font-weight:900;
  margin-right:6px;
}

.rank-name{
  flex:1;
  text-transform:uppercase;
}

.rank-amount{
  color:var(--samurai-orange);
  font-weight:700;
}

/* champion effect */

.rank-row:first-child{
  font-weight:900;
  font-size:1rem;
  text-shadow:0 0 10px var(--samurai-glow);
}

/* empty message */

.empty-msg{
  font-family:'Lato',sans-serif;
  font-size:0.85rem;
  color:#bbb;
  font-style:italic;
}

/* entry animation */

.entry-anim{
  animation:entrySlash .6s cubic-bezier(.23,1,.32,1) forwards;
}

@keyframes entrySlash{
  0%{
    opacity:0;
    transform:translateX(50px) skewX(-20deg);
  }
  100%{
    opacity:1;
    transform:translateX(0) skewX(-20deg);
  }
}

</style>
</head>

<body>

<div class="wrapper">

  <div class="blade-box entry-anim" id="mainBox">

    <div class="inner-content" id="leaderboardArea">

      <div class="board-title">MONTHLY TRIBUTES</div>
      <div class="empty-msg">Awaiting the first warrior...</div>

    </div>

  </div>

</div>

<script>

const API_URL = "https://backend.saweria.co/widgets/leaderboard/month";

const urlParams = new URLSearchParams(window.location.search);
const STREAM_KEY = urlParams.get("streamKey");

const leaderboardArea = document.getElementById("leaderboardArea");
const mainBox = document.getElementById("mainBox");

let donations = [];

const currencyFormatter = new Intl.NumberFormat("id-ID",{
  style:"currency",
  currency:"IDR",
  minimumFractionDigits:0
});

/* fetch leaderboard */

async function fetchLeaderboard(){

  if(!STREAM_KEY) return;

  try{

    const res = await axios.get(API_URL,{
      headers:{ "Stream-Key": STREAM_KEY }
    });

    if(res.data?.data){
      donations = res.data.data;
      renderLeaderboard();
    }

  }catch(err){
    console.error(err);
  }

}

/* render leaderboard */

function renderLeaderboard(){

  mainBox.classList.remove("entry-anim");
  void mainBox.offsetWidth;
  mainBox.classList.add("entry-anim");

  if(!donations.length){

    leaderboardArea.innerHTML = `
      <div class="board-title">MONTHLY TRIBUTES</div>
      <div class="empty-msg">No tributes this month</div>
    `;

    return;
  }

  const maxShow = Math.min(donations.length,5);

  let html = `<div class="board-title">MONTHLY TRIBUTES</div>`;

  for(let i=0;i<maxShow;i++){

    const item = donations[i];

    html += `
      <div class="rank-row">
        <div class="rank-name">
          <span class="rank-pos">#${i+1}</span>
          ${item.donator}
        </div>
        <div class="rank-amount">
          ${currencyFormatter.format(item.amount)}
        </div>
      </div>
    `;

  }

  leaderboardArea.innerHTML = html;

}

/* init */

if(STREAM_KEY){

  fetchLeaderboard();

  setInterval(fetchLeaderboard,60000);

}else{

  leaderboardArea.innerHTML =
  "<div style='color:red'>MISSING STREAM KEY</div>";

}

</script>

</body>
</html>
