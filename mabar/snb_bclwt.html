<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samurai Overlay — Ink III</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: transparent; overflow: hidden; }

    /* ═══════════════════════════
       WRAPPER
    ═══════════════════════════ */
    .overlay {
      position: fixed;
      top: 28px;
      right: 28px;
      width: 270px;
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* ═══════════════════════════
       MAIN CARD
    ═══════════════════════════ */
    .card {
      position: relative;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      clip-path: polygon(
        0% 0%,
        calc(100% - 22px) 0%,
        100% 22px,
        100% 100%,
        14px 100%,
        0% calc(100% - 14px)
      );
      overflow: hidden;
    }

    /* ── diagonal corner fill ── */
    .card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      border-style: solid;
      border-width: 0 24px 24px 0;
      border-color: transparent rgba(255,255,255,0.18) transparent transparent;
      z-index: 2;
    }

    /* ── outer border glow ── */
    .card-inner {
      position: absolute;
      inset: 0;
      clip-path: polygon(
        0% 0%,
        calc(100% - 22px) 0%,
        100% 22px,
        100% 100%,
        14px 100%,
        0% calc(100% - 14px)
      );
      border: 1.5px solid rgba(255,255,255,0.22);
      pointer-events: none;
      z-index: 1;
    }

    /* ── shimmer ── */
    .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 25%,
        rgba(255,255,255,0.06) 45%,
        transparent 65%
      );
      background-size: 250% 100%;
      animation: shimmer 6s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      35%  { background-position: -100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ═══════════════════════════
       TOP BAR (header strip)
    ═══════════════════════════ */
    .top-bar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px 7px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* vertical bar accent */
    .vbar {
      width: 3px;
      height: 16px;
      background: #fff;
      clip-path: polygon(0 0, 100% 8%, 100% 92%, 0 100%);
    }

    .top-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      position: relative;
    }
    .live-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.4);
      animation: ripple 2.2s ease-out infinite;
    }
    @keyframes ripple {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    .live-txt {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ═══════════════════════════
       BODY (main data)
    ═══════════════════════════ */
    .card-body {
      position: relative;
      z-index: 3;
      padding: 12px 16px 14px 12px;
    }

    /* TYPE label */
    .type-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .type-line-l {
      width: 10px;
      height: 1.5px;
      background: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }

    .type-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 8px;
      white-space: nowrap;
    }

    .type-line-r {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.25), transparent);
    }

    /* VALUE — the star of the show */
    .value-wrap {
      position: relative;
      padding-left: 10px;
      border-left: 2px solid rgba(255,255,255,0.7);
      margin-bottom: 2px;
    }

    .value-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: #fff;
      letter-spacing: 3px;
      line-height: 1;
      text-shadow:
        0 0 40px rgba(255,255,255,0.3),
        0 2px 6px rgba(0,0,0,0.9);
    }

    /* ── flip animation ── */
    #displayArea { perspective: 500px; }

    .flip-in {
      animation: flipIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes flipIn {
      0%   { opacity: 0; transform: rotateX(-70deg) translateY(-6px); }
      100% { opacity: 1; transform: rotateX(0deg)   translateY(0); }
    }

    /* ═══════════════════════════
       BOTTOM BAR
    ═══════════════════════════ */
    .bottom-bar {
      position: relative;
      z-index: 3;
      padding: 6px 14px 8px 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
    }

    /* decorative dashes */
    .dashes {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .dashes span {
      display: block;
      height: 2px;
      background: rgba(255,255,255,0.5);
      border-radius: 99px;
    }
    .dashes span:nth-child(1) { width: 14px; }
    .dashes span:nth-child(2) { width: 6px; }
    .dashes span:nth-child(3) { width: 3px; }

    /* progress bar */
    .prog-track {
      flex: 1;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
      border-radius: 99px;
      transform-origin: left;
      animation: shrink 8s linear forwards;
    }
    @keyframes shrink {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    /* counter badge */
    .counter {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.3);
    }

    /* ═══════════════════════════
       SIDE DECORATIVE TICKS
    ═══════════════════════════ */
    .side-ticks {
      position: absolute;
      left: -18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }
    .side-ticks span {
      display: block;
      height: 1.5px;
      background: rgba(255,255,255,0.35);
      border-radius: 99px;
    }
    .side-ticks span:nth-child(1) { width: 14px; }
    .side-ticks span:nth-child(2) { width: 8px; }
    .side-ticks span:nth-child(3) { width: 5px; }
    .side-ticks span:nth-child(4) { width: 8px; }
    .side-ticks span:nth-child(5) { width: 14px; }

  </style>
</head>

<body>
  <div class="overlay">
    <div class="card">
      <div class="card-inner"></div>
      <div class="shimmer"></div>

      <!-- TOP BAR -->
      <div class="top-bar">
        <div class="top-left">
          <div class="vbar"></div>
          <span class="top-title">侍 &nbsp;SDK</span>
        </div>
        <div class="top-right">
          <div class="live-dot"></div>
          <span class="live-txt">Live</span>
        </div>
      </div>

      <!-- BODY -->
      <div class="card-body">
        <div id="displayArea" class="flip-in">
          <div class="type-row">
            <span class="type-line-l"></span>
            <span class="type-label">System</span>
            <span class="type-line-r"></span>
          </div>
          <div class="value-wrap">
            <div class="value-main">Loading…</div>
          </div>
        </div>
      </div>

      <!-- BOTTOM BAR -->
      <div class="bottom-bar">
        <div class="dashes">
          <span></span><span></span><span></span>
        </div>
        <div class="prog-track">
          <div class="prog-fill" id="progressFill"></div>
        </div>
        <span class="counter" id="counterTxt">8s</span>
      </div>
    </div>

    <!-- side decorative ticks -->
    <div class="side-ticks">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <script>
    const displayArea  = document.getElementById("displayArea");
    const progressFill = document.getElementById("progressFill");
    const counterTxt   = document.getElementById("counterTxt");

    let showMap  = true;
    let lastMap  = "Unknown Realm";
    let lastUser = "Unknown Ronin";
    let refreshTimer;
    let countdownTimer;
    let countdownVal = 8;

    const API_URL = "https://discord.mbingsdk.my.id/api/roblox/current-room";

    function getQueryId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      countdownVal = 8;
      counterTxt.textContent = countdownVal + "s";
      countdownTimer = setInterval(() => {
        countdownVal--;
        counterTxt.textContent = countdownVal + "s";
        if (countdownVal <= 0) clearInterval(countdownTimer);
      }, 1000);
    }

    function resetProgress() {
      progressFill.style.animation = 'none';
      void progressFill.offsetWidth;
      progressFill.style.animation = 'shrink 8s linear forwards';
      startCountdown();
    }

    function render(label, value) {
      displayArea.classList.remove("flip-in");
      void displayArea.offsetWidth;
      displayArea.innerHTML = `
        <div class="type-row">
          <span class="type-line-l"></span>
          <span class="type-label">${label}</span>
          <span class="type-line-r"></span>
        </div>
        <div class="value-wrap">
          <div class="value-main">${value}</div>
        </div>
      `;
      displayArea.classList.add("flip-in");
      resetProgress();
    }

    async function fetchData() {
      let url = API_URL;
      const id = getQueryId();
      if (id) url += `?id=${id}`;
      try {
        const res = await axios.get(url);
        lastMap  = res.data?.lastLocation || "Unknown Realm";
        lastUser = res.data?.username     || "Unknown Ronin";
      } catch {
        lastMap  = "Disconnected";
        lastUser = "No Data";
      }
      clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchData, 20000);
    }

    function toggleDisplay() {
      if (showMap) {
        render("Current Location", lastMap);
      } else {
        render("Username", lastUser);
      }
      showMap = !showMap;
    }

    fetchData();
    setTimeout(toggleDisplay, 500);
    setInterval(toggleDisplay, 8000);
  </script>
</body>
</html>
