<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Samurai Music Playlist Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --samurai-orange: #FF8900;
      --bg-dark: rgba(12, 12, 12, 0.95);
      --glow: rgba(255, 137, 0, 0.2);
    }
    
    body { 
      margin: 0; 
      background: transparent; 
      font-family: 'Cinzel', serif; 
      overflow: hidden; 
    }

    .wrapper {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 360px;
    }

    /* Box Utama Samurai */
    .player-card {
      background: var(--bg-dark);
      transform: skewX(-15deg);
      border-left: 6px solid var(--samurai-orange);
      border-bottom: 2px solid var(--samurai-orange);
      box-shadow: 10px 10px 25px rgba(0,0,0,0.8);
      padding: 20px;
      position: relative;
      /* Tekstur garis halus */
      background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,137,0,0.03) 1px, rgba(255,137,0,0.03) 2px);
      background-size: 100% 4px;
    }

    .inner-content {
      transform: skewX(15deg); /* Meluruskan konten */
    }

    .status-label {
      font-size: 0.75rem;
      color: var(--samurai-orange);
      letter-spacing: 4px;
      font-weight: 900;
      display: block;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 137, 0, 0.2);
      padding-bottom: 5px;
    }

    /* AREA KOSONG UNTUK PLAYLIST (DI BAWAH STATUS) */
    .playlist-space {
      /* Tinggi sekitar 160px-180px cukup untuk 5-6 baris teks */
      min-height: 180px; 
      width: 100%;
      margin-bottom: 20px;
      /* background: rgba(255,255,255,0.02); /* Aktifkan jika ingin melihat areanya saat atur posisi */
    }

    /* Bagian Kontrol Musik di Bawah */
    .footer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .btns {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .btn { color: #555; font-size: 1.1rem; }
    .btn-play { 
      color: var(--samurai-orange); 
      font-size: 1.6rem;
      filter: drop-shadow(0 0 5px var(--samurai-orange));
    }

    /* Visualizer (EQ) */
    .visualizer {
      display: flex;
      gap: 3px;
      height: 18px;
      align-items: flex-end;
    }
    .bar {
      width: 3px;
      background: var(--samurai-orange);
      animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { height: 20%; }
      50% { height: 100%; }
    }

    /* Progress Bar paling bawah */
    .progress-wrap {
      width: 100%;
      height: 3px;
      background: #222;
      margin-top: 15px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--samurai-orange);
      width: 45%;
      box-shadow: 0 0 10px var(--samurai-orange);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="player-card">
      <div class="inner-content">
        
        <span class="status-label">PLAYER STATUS</span>
        
        <div class="playlist-space"></div>

        <div class="footer-controls">
          <div class="btns">
            <div class="btn">⏮</div>
            <div class="btn btn-play">▶</div>
            <div class="btn">⏭</div>
          </div>

          <div class="visualizer">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar"></div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
