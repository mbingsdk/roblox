<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Samurai Music Widget - Expanded</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --samurai-orange: #FF8900;
      --bg-dark: rgba(15, 15, 15, 0.95);
      --glow: rgba(255, 137, 0, 0.3);
    }
    
    body { 
      margin: 0; 
      background: transparent; 
      font-family: 'Cinzel', serif; 
      overflow: hidden; 
    }

    /* Container Utama yang lebih tinggi */
    .player-container {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 350px;
      height: 600px; /* Ditambah tingginya menjadi 600px */
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Memaksa UI Player tetap di paling bawah */
    }

    /* Area Kosong untuk Playlist kamu */
    .playlist-placeholder {
      height: 450px; /* Area sangat luas untuk menaruh playlist manual */
      width: 100%;
      /* background: rgba(255, 137, 0, 0.05); /* Aktifkan jika ingin melihat batas area saat setting */
      margin-bottom: 5px;
    }

    /* UI Player Modern Samurai */
    .player-ui {
      background: var(--bg-dark);
      padding: 20px;
      transform: skewX(-15deg);
      border-right: 6px solid var(--samurai-orange);
      border-top: 2px solid rgba(255, 137, 0, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      /* Pattern Grid */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 15px 15px;
    }

    .inner { 
      transform: skewX(15deg); /* Mengembalikan teks agar tidak miring */
    }

    .now-playing-label {
      font-size: 0.7rem;
      color: var(--samurai-orange);
      letter-spacing: 3px;
      margin-bottom: 10px;
      display: block;
      font-weight: 900;
    }

    /* Area Judul Lagu (Dikosongkan sesuai permintaan) */
    .song-title {
      font-size: 1.2rem;
      color: #fff;
      min-height: 1.5rem; /* Menjaga ruang agar tidak kempes */
      margin-bottom: 15px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn { color: #666; font-size: 1.3rem; cursor: pointer; }
    .btn-play { 
      color: var(--samurai-orange); 
      font-size: 1.8rem;
      filter: drop-shadow(0 0 8px var(--glow));
    }

    /* Visualizer Hiasan */
    .visualizer {
      display: flex;
      gap: 4px;
      height: 20px;
      align-items: flex-end;
    }
    .bar {
      width: 4px;
      background: var(--samurai-orange);
      animation: eq 1s ease-in-out infinite;
    }
    @keyframes eq {
      0%, 100% { height: 20%; }
      50% { height: 100%; }
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: #222;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--samurai-orange);
      width: 35%; /* Hanya pemanis visual */
      box-shadow: 0 0 10px var(--samurai-orange);
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="playlist-placeholder"></div>

    <div class="player-ui">
      <div class="inner">
        <span class="now-playing-label">PLAYER STATUS</span>
        
        <div class="song-title" id="songTitle"></div>
        
        <div class="controls-row">
          <div class="buttons">
            <div class="btn">⏮</div>
            <div class="btn btn-play">▶</div>
            <div class="btn">⏭</div>
          </div>

          <div class="visualizer">
            <div class="bar" style="animation-duration: 0.6s"></div>
            <div class="bar" style="animation-duration: 0.9s"></div>
            <div class="bar" style="animation-duration: 0.7s"></div>
            <div class="bar" style="animation-duration: 1.1s"></div>
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
