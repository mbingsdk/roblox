<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bushido Scroll Donation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=RocknRoll+One&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root {
      --samurai-orange: #FF8900;
      --scroll-paper: #f2e8cf; /* Warna kertas kuno */
      --ink-black: #1a1a1a;
      --ink-glow: rgba(255, 137, 0, 0.3);
    }

    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'RocknRoll One', sans-serif;
    }

    /* === Desain Gulungan (Scroll) === */
    .scroll-container {
      position: fixed;
      top: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .scroll-body {
      position: relative;
      background: var(--scroll-paper);
      padding: 15px 40px;
      min-width: 280px;
      
      /* Efek Melengkung seperti Gulungan Kertas */
      border-top: 4px solid #3d3d3d;
      border-bottom: 4px solid #3d3d3d;
      border-radius: 40px / 10px; 
      
      box-shadow: 
        5px 5px 15px rgba(0,0,0,0.4),
        inset 0 0 50px rgba(188, 133, 45, 0.2);
        
      /* Garis dekoratif di pinggir */
      border-right: 15px solid var(--samurai-orange);
    }

    /* Aksen Tali/Pengikat di sisi kiri */
    .scroll-body::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--ink-black);
      opacity: 0.2;
    }

    /* === Konten Teks === */
    .content {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .label-tribute {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: #7d2a1a; /* Merah stempel kuno */
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .donator-name {
      font-size: 1.6rem;
      color: var(--ink-black);
      line-height: 1.1;
      margin-bottom: 5px;
      /* Efek Tinta */
      filter: drop-shadow(1px 1px 0px rgba(255,137,0,0.2));
    }

    .amount-box {
      display: inline-block;
      background: var(--ink-black);
      color: var(--samurai-orange);
      padding: 2px 12px;
      font-size: 1.1rem;
      font-weight: bold;
      align-self: flex-end;
      transform: rotate(-1deg); /* Sedikit miring biar estetik */
      box-shadow: 3px 3px 0px var(--samurai-orange);
    }

    .message {
      font-size: 0.85rem;
      color: #444;
      margin-top: 8px;
      font-style: italic;
      border-right: 2px solid var(--samurai-orange);
      padding-right: 8px;
      max-width: 250px;
    }

    /* === Animasi: Muncul seperti gulungan dibuka === */
    .roll-animation {
      animation: openScroll 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      transform-origin: right;
    }

    @keyframes openScroll {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    /* Animasi Teks */
    .fade-text {
      animation: fadeInText 0.5s ease-out forwards;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="scroll-container">
    <div class="scroll-body roll-animation" id="scrollBox">
      <div class="content" id="donationArea">
        <div class="label-tribute">PREPARING...</div>
        <div class="donator-name">BUSHIDO</div>
      </div>
    </div>
  </div>

  <script>
    const donationArea = document.getElementById("donationArea");
    const scrollBox = document.getElementById("scrollBox");
    const API_URL = "https://backend.saweria.co/widgets/recent";

    const urlParams = new URLSearchParams(window.location.search);
    const STREAM_KEY = urlParams.get('streamKey');

    let donations = [];
    let currentIndex = 0;

    const formatter = new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      minimumFractionDigits: 0
    });

    function renderError(msg) {
        donationArea.innerHTML = `<div class="donator-name" style="color:red; font-size:1rem;">${msg}</div>`;
    }

    async function fetchDonations() {
      if (!STREAM_KEY) {
          renderError("MISSING KEY");
          return;
      }
      try {
        const res = await axios.get(API_URL, { headers: { 'Stream-Key': STREAM_KEY } });
        if (res.data && res.data.data) {
          donations = res.data.data;
          if (donations.length === 0) renderEmpty();
        }
      } catch (err) {
        renderError("CONN ERROR");
      }
    }

    function renderEmpty() {
        donationArea.innerHTML = `
          <div class="label-tribute">WAITED FOR TRIBUTE</div>
          <div class="donator-name">NO ONE YET</div>
        `;
    }

    function renderDonation() {
      if (!donations || donations.length === 0) return;

      const item = donations[currentIndex];
      
      // Reset Animasi Gulungan (Opsional: biarkan terbuka saja, teksnya saja yang fade)
      donationArea.classList.remove("fade-text");
      void donationArea.offsetWidth; 

      const name = item.donator_name;
      const amount = formatter.format(item.amount);
      const message = item.message ? `"${item.message}"` : "";

      donationArea.innerHTML = `
        <div class="label-tribute">🏯 LATEST TRIBUTE</div>
        <div class="donator-name">${name}</div>
        <div class="amount-box">${amount}</div>
        ${message ? `<div class="message">${message}</div>` : ''}
      `;

      donationArea.classList.add("fade-text");

      const maxShow = Math.min(donations.length, 5);
      currentIndex = (currentIndex + 1) % maxShow;
    }

    if (STREAM_KEY) {
        fetchDonations().then(() => {
            if(donations.length > 0) renderDonation();
            setInterval(() => { if(donations.length > 0) renderDonation(); }, 7000);
            setInterval(fetchDonations, 20000);
        });
    } else {
        renderError("ADD ?streamKey=...");
    }
  </script>
</body>
</html>
