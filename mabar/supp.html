<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samurai Blade Donation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:ital,wght@1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    :root {
      --samurai-orange: #FF8900;
      --samurai-glow: rgba(255, 137, 0, 0.5);
      --bg-black: rgba(10, 10, 10, 0.9);
      --text-white: #ffffff;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: 'Cinzel', serif;
      overflow: hidden;
    }

    .wrapper {
      position: fixed;
      top: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* === Main Blade Box === */
    .blade-box {
      position: relative;
      background: var(--bg-black);
      padding: 10px 30px;
      min-width: 250px;
      transform: skewX(-20deg); /* Lebih miring dari Map agar terlihat lebih tajam */
      
      border-right: 8px solid var(--samurai-orange);
      border-left: 2px solid rgba(255, 137, 0, 0.3);
      
      box-shadow: -10px 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Efek Kilatan Pedang (Sama dengan Map agar serasi) */
    .blade-box::after {
      content: '';
      position: absolute;
      top: 0; left: -150%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: slash 5s infinite;
    }

    /* === Sub-Tab untuk Harga (Talisman Style) === */
    .amount-tag {
      background: var(--samurai-orange);
      color: #000;
      font-weight: 900;
      padding: 4px 15px;
      font-size: 1rem;
      margin-top: -2px;
      margin-right: 15px;
      transform: skewX(-20deg);
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
      z-index: 2;
    }

    /* === Teks Konten === */
    .inner-content {
      transform: skewX(20deg); /* Meluruskan teks */
      text-align: right;
    }

    .donator-label {
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: var(--samurai-orange);
      margin-bottom: -5px;
      display: block;
    }

    .donator-name {
      font-size: 1.5rem;
      color: var(--text-white);
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
    }

    .donator-msg {
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      color: #bbb;
      font-style: italic;
      max-width: 200px;
      border-top: 1px solid rgba(255,137,0,0.2);
      margin-top: 5px;
      padding-top: 5px;
    }

    /* === Animasi === */
    @keyframes slash {
      0%, 40% { left: -150%; }
      50% { left: 150%; }
      100% { left: 150%; }
    }

    .entry-anim {
      animation: entrySlash 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes entrySlash {
      0% { opacity: 0; transform: translateX(50px) skewX(-20deg); }
      100% { opacity: 1; transform: translateX(0) skewX(-20deg); }
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="blade-box entry-anim" id="mainBox">
      <div class="inner-content" id="donationArea">
        <span class="donator-label">NO TRIBUTES THIS MONTH</span>
        <div class="donator-name">NONE</div>
        <div class="donator-msg">"Awaiting the next blade..."</div>
      </div>
    </div>
    <div class="amount-tag" id="amountTag">Rp 0</div>
  </div>

  <script>
    const donationArea = document.getElementById("donationArea");
    const amountTag = document.getElementById("amountTag");
    const mainBox = document.getElementById("mainBox");
    
    // const API_URL = "https://backend.saweria.co/widgets/recent";
    const API_URL = "https://backend.saweria.co/widgets/leaderboard/month";
    const urlParams = new URLSearchParams(window.location.search);
    const STREAM_KEY = urlParams.get('streamKey');

    let donations = [];
    let currentIndex = 0;

    const formatter = new Intl.NumberFormat('id-ID', {
      style: 'currency', currency: 'IDR', minimumFractionDigits: 0
    });

    async function fetchDonations() {
      if (!STREAM_KEY) return;
      try {
        const res = await axios.get(API_URL, { headers: { 'Stream-Key': STREAM_KEY } });
        if (res.data?.data) donations = res.data.data;
      } catch (err) { console.error(err); }
    }

    function renderDonation() {
      if (!donations.length) return;

      const item = donations[currentIndex];
      
      // Reset Animasi Slash
      mainBox.classList.remove("entry-anim");
      void mainBox.offsetWidth; 
      mainBox.classList.add("entry-anim");

      const name = item.donator;
      const amount = formatter.format(item.amount);
      const message = item.message ? `"${item.message}"` : `"Makasih..."`;

      donationArea.innerHTML = `
        <span class="donator-label">SUPPORT BULAN INI</span>
        <div class="donator-name">${name}</div>
        ${message ? `<div class="donator-msg">${message}</div>` : ''}
      `;
      
      amountTag.textContent = amount;

      const maxShow = Math.min(donations.length, 5);
      currentIndex = (currentIndex + 1) % maxShow;
    }

    if (STREAM_KEY) {
      fetchDonations().then(() => {
        if(donations.length > 0) renderDonation();
        setInterval(() => { if(donations.length > 0) renderDonation(); }, 8000); // Interval slide
        setInterval(fetchDonations, 60000); // Interval fetch
      });
    } else {
      donationArea.innerHTML = "<div style='color:red'>MISSING KEY</div>";
    }
  </script>
</body>
</html>
