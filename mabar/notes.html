<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Samurai Info Rotator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --samurai-orange: #FF8900;
      --bg-dark: rgba(10, 10, 10, 0.9);
      --text-white: #ffffff;
    }
    body { margin: 0; background: transparent; font-family: 'Cinzel', serif; overflow: hidden; }

    .info-box {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--bg-dark);
      border-left: 6px solid var(--samurai-orange);
      padding: 20px 25px;
      transform: skewX(-15deg);
      width: 320px;
      min-height: 80px; /* Lebih tinggi */
      display: flex;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .info-content {
      transform: skewX(15deg);
      width: 100%;
      transition: all 0.5s ease-in-out;
    }

    .fade-out { opacity: 0; transform: skewX(15deg) translateY(10px); }

    .label {
      font-size: 0.8rem;
      color: var(--samurai-orange);
      letter-spacing: 2px;
      font-weight: 800;
      display: block;
      margin-bottom: 8px;
    }

    .text {
      font-family: 'Lato', sans-serif;
      font-size: 1.1rem;
      color: var(--text-white);
      font-weight: 700;
    }

    .cmd {
      background: rgba(255, 137, 0, 0.2);
      padding: 2px 8px;
      border: 1px dashed var(--samurai-orange);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <div class="info-content" id="infoContent">
      <span class="label">SYSTEM</span>
      <div class="text">Initializing...</div>
    </div>
  </div>

  <script>
    const infoContent = document.getElementById('infoContent');
    const messages = [
      { label: "🎵 MUSIC COMMAND", text: 'Type <span class="cmd">/play judul-artist</span>' },
      { label: "👤 ROBLOX PROFILE", text: "Link in Bio" },
      { label: "🏯 JOIN CURRENT MAP", text: "Link in Bio" },
      { label: "🛰️ DISCORD SERVER", text: "Join our Community, in Bio" },
      { label: "💎 SUPPORT STREAM", text: "Support via Saweria in Bio" }
    ];
    let idx = 0;
    function update() {
      infoContent.classList.add('fade-out');
      setTimeout(() => {
        infoContent.innerHTML = `<span class="label">${messages[idx].label}</span><div class="text">${messages[idx].text}</div>`;
        infoContent.classList.remove('fade-out');
        idx = (idx + 1) % messages.length;
      }, 500);
    }
    update();
    setInterval(update, 6000);
  </script>
</body>
</html>
