<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samurai HUD & Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --samurai-orange: #FF8900;
      --bg-dark: rgba(15, 15, 15, 0.95);
      --text-white: #ffffff;
      --glow: rgba(255, 137, 0, 0.5);
    }

    body {
      margin: 0;
      background: transparent;
      font-family: 'Cinzel', serif;
      overflow: hidden;
    }

    /* Wrapper Utama (Pojok Kiri Bawah/Tengah) */
    .hud-container {
      position: fixed;
      top: 200px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Jarak antara Info Box dan Music Player */
      width: 320px;
    }

    /* =========================================
       1. INFO ROTATOR (ANIMASI BERGANTIAN)
       ========================================= */
    .info-box {
      background: var(--bg-dark);
      border-left: 6px solid var(--samurai-orange);
      padding: 15px 20px;
      transform: skewX(-15deg);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      min-height: 50px;
      display: flex;
      align-items: center;
    }

    /* Garis dekorasi atas */
    .info-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--samurai-orange), transparent);
    }

    /* Container konten agar teks tegak */
    .info-content {
      transform: skewX(15deg);
      width: 100%;
      opacity: 1;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease;
    }

    /* Animasi Fade Out/In */
    .fade-out {
      opacity: 0;
      transform: skewX(15deg) translateY(10px);
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--samurai-orange);
      letter-spacing: 2px;
      font-weight: 800;
      display: block;
      margin-bottom: 4px;
    }

    .info-text {
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .highlight-cmd {
      background: rgba(255, 137, 0, 0.2);
      padding: 2px 6px;
      border: 1px dashed var(--samurai-orange);
      font-family: monospace;
    }

    /* =========================================
       2. MUSIC PLAYER WIDGET (STATIS)
       ========================================= */
    .player-box {
      background: rgba(20, 20, 20, 0.9);
      padding: 15px 20px;
      transform: skewX(-15deg);
      border-right: 4px solid var(--samurai-orange);
      position: relative;
      /* Pattern Grid Halus */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    .player-inner {
      transform: skewX(15deg);
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .playlist-title {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 1px;
    }

    .live-indicator {
      font-size: 0.6rem;
      color: var(--samurai-orange);
      border: 1px solid var(--samurai-orange);
      padding: 1px 4px;
      animation: blink 2s infinite;
    }

    .track-name {
      font-size: 1.1rem;
      color: var(--text-white);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
      text-shadow: 0 0 5px var(--glow);
    }

    /* Player Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
    }

    .btn {
      cursor: pointer;
      color: #aaa;
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .btn:hover { color: #fff; }
    .btn-play { 
      color: var(--samurai-orange); 
      font-size: 1.5rem; 
      filter: drop-shadow(0 0 5px var(--glow));
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--samurai-orange);
      width: 0%;
      position: relative;
      animation: musicProgress 60s linear infinite; /* Simulasi lagu 1 menit loop */
    }

    /* Efek Kilatan di ujung progress bar */
    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 5px;
      background: #fff;
      box-shadow: 0 0 10px #fff;
    }

    /* Visualizer Bars (Hiasan bergerak) */
    .visualizer {
      display: flex;
      gap: 3px;
      height: 15px;
      align-items: flex-end;
    }
    .bar {
      width: 4px;
      background: var(--samurai-orange);
      animation: equalizer 1s ease-in-out infinite;
    }
    .bar:nth-child(1) { animation-duration: 0.8s; height: 40%; }
    .bar:nth-child(2) { animation-duration: 1.2s; height: 80%; }
    .bar:nth-child(3) { animation-duration: 0.9s; height: 50%; }
    .bar:nth-child(4) { animation-duration: 1.5s; height: 70%; }

    /* Keyframes */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes musicProgress { 0% { width: 0%; } 100% { width: 100%; } }
    @keyframes equalizer { 0%, 100% { height: 20%; } 50% { height: 100%; } }

  </style>
</head>
<body>

  <div class="hud-container">
    
    <div class="info-box">
      <div class="info-content" id="infoContent">
        <span class="info-label">SYSTEM</span>
        <div class="info-text">Initializing...</div>
      </div>
    </div>

    <div class="player-box">
      <div class="player-inner">
        
        <div class="playlist-header">
          <span class="playlist-title">STREAM PLAYLIST</span>
          <span class="live-indicator">LIVE</span>
        </div>

        <div class="track-name">Waiting for Request...</div>

        <div class="controls">
          <div class="btn">⏮</div>
          <div class="btn btn-play">▶</div>
          <div class="btn">⏭</div>
          
          <div class="visualizer" style="margin-left: auto;">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-fill"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const infoContent = document.getElementById('infoContent');

    // DAFTAR PESAN YANG AKAN MUNCUL BERGANTIAN
    const messages = [
      {
        label: "🎵 MUSIC COMMAND",
        html: `Type <span class="highlight-cmd">/play title-artist</span>`
      },
      {
        label: "👤 ROBLOX PROFILE",
        html: "Check Link in Bio"
      },
      {
        label: "🏯 JOIN CURRENT MAP",
        html: "Join via Link in Bio"
      },
      {
        label: "🛰️ DISCORD SERVER",
        html: "Join our Community (Link Bio)"
      },
      {
        label: "💎 SUPPORT STREAM",
        html: "Donation Link in Bio"
      }
    ];

    let currentIndex = 0;

    function updateInfo() {
      // 1. Animasi Keluar
      infoContent.classList.add('fade-out');

      // 2. Ganti Teks setelah animasi keluar selesai (0.5 detik)
      setTimeout(() => {
        const msg = messages[currentIndex];
        
        infoContent.innerHTML = `
          <span class="info-label">${msg.label}</span>
          <div class="info-text">${msg.html}</div>
        `;

        // 3. Animasi Masuk
        infoContent.classList.remove('fade-out');

        // Pindah ke pesan berikutnya
        currentIndex = (currentIndex + 1) % messages.length;
      }, 500);
    }

    // Jalankan pertama kali
    updateInfo();

    // Ganti pesan setiap 5 detik
    setInterval(updateInfo, 5000);

  </script>
</body>
</html>
